.m .row .g{flex:1 1 80px;min-width:80px}

.sc small{font:500 11px 'Jost',sans-serif;letter-spacing:.25em;color:var(--red);margin-left:.7em;vertical-align:middle}

.br{font:500 11px 'Jost',sans-serif;letter-spacing:.34em;color:var(--hi)}.br span{color:var(--red);margin-left:.5em}

:root{--hue:0deg}#th,#rec,.vm b,.lcd{filter:hue-rotate(var(--hue))}
html,body{height:100%}body{display:flex;flex-direction:column;overflow:hidden}
#top{flex:none;padding:10px 14px;gap:8px}#go{padding:14px 20px}#pr .bt,.rb .bt{padding:12px 10px}
#viz{flex:none;height:72px;padding:8px 8px 0}#viz canvas{height:100%}
#tabs{flex:none;display:flex;gap:6px;padding:8px 8px 0}#tabs button{flex:1;padding:11px 6px}
#stage{flex:1;min-height:0;overflow:auto}
.pane{display:none;grid-template-columns:1fr;gap:8px;padding:8px;align-content:start}.pane.on{display:grid}
.pane .m{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:10px 20px}.pane .m h2{flex:0 0 100%}.pane .m .g{flex:1 1 150px}.pane .m .row{flex:1 1 100%}
#rack{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));padding:0}#rh{padding:0 0 6px;border:0;margin:0}
#rack .m{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px}#rack .m h2,#rack .m .row{grid-column:1/-1}
#bot{flex:none;padding:0 8px 8px;display:flex;gap:10px;flex-wrap:wrap}#bot .g{min-width:150px}
#mv{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:8px}
.st{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--ln);border-radius:4px;background:linear-gradient(var(--p1),var(--p2))}
.st em{font:500 11px 'Jost',sans-serif;font-style:normal;letter-spacing:.2em;color:var(--hi);width:118px;flex:none}.st input{flex:1;min-width:60px}.st .vm{margin:0}.st.off{opacity:.45}
body.simple #tabs{display:none}body.simple #viz{flex:1;height:auto}
#rec{width:64px;min-width:0;padding:0}#rec svg{width:42px;height:40px}
/* v3: silver bezels, nozzle buttons, reference layout */
:root{--pn:#16171a;--bz:linear-gradient(#eceff3,#8f959e 55%,#c9cdd3)}
html[data-t=light]{--pn:#dfe2e6}html[data-t=rad]{--pn:#03140a;--bz:linear-gradient(#5dff7d,#0d5a1e 55%,#2fcf4f)}
#top{background:none;box-shadow:none;border:0;padding:16px 18px 0;gap:16px}
.hr{gap:16px;padding:0;border:0;align-items:stretch}.hr>*{border-left:0}
.bx,.ky,.m,.st{border:3px solid transparent;border-radius:12px;background:linear-gradient(var(--pn),var(--pn)) padding-box,var(--bz) border-box;box-shadow:0 3px 6px #0006}
.bx{padding:8px 20px}.hr .ky{padding:6px 24px;background:linear-gradient(var(--pn),var(--pn)) padding-box,linear-gradient(var(--red),var(--red2)) border-box}.ky b{font-size:20px;letter-spacing:.14em}
.ttl{flex:1 1 260px;background:linear-gradient(var(--red),var(--red2)) padding-box,var(--bz) border-box}.ttl .sc{color:#fff;font-size:24px}
.mix{flex:2 1 340px;gap:30px}.slp{flex:1.4 1 300px;flex-direction:row;align-items:center;gap:18px}.slp .g{flex:1}
.go{padding:0;background:none;border:0;box-shadow:none}#go{height:100%;min-width:108px;font-size:14px;color:#fff;background:linear-gradient(var(--red),var(--red2))}
.skn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 6px}.skn small{font:500 10px 'Jost',sans-serif;letter-spacing:.22em;color:var(--hi)}
#th{margin:0;align-self:center}
#rec{width:62px;height:62px;min-width:0;padding:0;align-self:center;border:4px solid transparent;border-radius:50%;background:radial-gradient(circle at 36% 28%,#ff8a7e,#e0261b 40%,#8d0b05) padding-box,conic-gradient(from 210deg,#f7f8f9,#a3a8ae,#e8eaec,#7a8087,#f4f5f6,#a9aeb4,#e4e6e8,#8a9097,#f7f8f9) border-box;box-shadow:0 3px 6px #0008,inset 0 -3px 5px #0005}
#rec svg{width:28px;height:26px;stroke:#fff}
#pr{flex:1 1 480px;padding:6px;gap:10px;background:linear-gradient(var(--pn),var(--pn)) padding-box,linear-gradient(var(--red),var(--red2)) border-box}
#pr .bt{flex:1;min-height:58px;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.05;font-size:15px;overflow:hidden;padding:8px 40% 8px 34px}
#pr .bt::after{content:"";position:absolute;right:8px;bottom:0;width:36%;height:78%;background:var(--red);opacity:.6;-webkit-mask:var(--art) right bottom/contain no-repeat;mask:var(--art) right bottom/contain no-repeat}
#pr .bt.on::after{background:#000;opacity:.35}
#pr .bt:nth-child(1){--art:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%2060%27%3E%3Cpath%20d%3D%27M10%2060V40H4l8-14H7L16%2010l9%2016h-5l8%2014h-6v20zM48%2060V34h-7l10-18h-6L56%200l11%2016h-6l10%2018h-7v26zM84%2060V44h-5l7-12h-4l7-12%207%2012h-4l7%2012h-5v16z%27%2F%3E%3C%2Fsvg%3E")}#pr .bt:nth-child(2){--art:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%2060%27%3E%3Cpath%20d%3D%27M0%2060V40l8-4%204-12h14l4%2012%208%204v20zM48%2060V30l6-4%202-14h18l2%2014%206%204v30zM86%2060V44l5-6h9v22z%27%2F%3E%3C%2Fsvg%3E")}#pr .bt:nth-child(3){--art:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%2060%27%3E%3Cpath%20d%3D%27M0%2060L22%2018l10%2014L46%206l22%2036%2010-14%2022%2032z%27%2F%3E%3C%2Fsvg%3E")}
.rb{flex:0 0 auto;gap:14px;padding:8px 14px}
.bt{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:10px 18px 10px 36px;border-radius:9px;background:linear-gradient(var(--b1),var(--b2));box-shadow:inset 0 1px 0 #ffffff40,inset 0 -3px 4px #0006,0 3px 5px #0008}
.bt::before{content:"";position:absolute;left:13px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd2cc,var(--red) 40%,var(--red2));box-shadow:0 0 0 2px #cfd3d9,0 0 0 3px #50545a,inset 0 -1px 2px #0008}
.bt.on::before{box-shadow:0 0 0 2px #cfd3d9,0 0 0 3px #50545a,0 0 9px var(--red)}.bt.s{padding:3px 8px}.bt.s::before{display:none}.bt:active{transform:translateY(1px);box-shadow:inset 0 2px 4px #000a}
select{border-radius:9px;background:linear-gradient(var(--b1),var(--b2));box-shadow:inset 0 1px 0 #ffffff33,inset 0 -2px 3px #0005}
#viz{height:20vh;height:20dvh;gap:18px;padding:18px 18px 4px}
.win{background:var(--bz);border-radius:12px;padding:0;box-shadow:0 3px 6px #0006}.win canvas{inset:3px;width:calc(100% - 6px)!important;height:calc(100% - 6px)!important;border:0}
#sc,#sp{border-radius:9px}.cap{left:16px;top:12px}
#tabs{padding:14px 18px 0;gap:12px}#tabs button{padding:14px 8px}
.pane{gap:0;padding:0 18px}.pane .m{padding:16px 22px;margin:10px 0;border:3px solid transparent}.pane .m:first-child{border:3px solid transparent}
#rack .m{border:3px solid transparent;border-radius:12px;padding:16px}.st{padding:8px 14px;margin:4px 0}
#bot{padding:12px 18px 16px;gap:18px;border:0;align-items:center}#bot .bx{padding:6px 16px}
.vsw{margin-left:auto;display:flex;align-items:center;gap:12px}.lb{background:none;border:0;font:inherit;letter-spacing:.2em;color:var(--tx);cursor:pointer}.lb.on{color:var(--hi)}
.sw{position:relative;width:48px;height:22px;border-radius:999px;background:#000;border:2px solid #c9cdd3;cursor:pointer;padding:0}.sw i{position:absolute;top:2px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}body.simple .sw i{left:27px}

/* v4: reference proportions, static windows, red lower area */
#top{padding:2vh 1.4vw 0;gap:2vh}#top .hr{gap:1.4vw;height:clamp(84px,11.3vh,122px)}#top .hr>*{min-width:0}
.ttl{flex:438 1 0;display:flex;align-items:center;justify-content:center;gap:4%;padding:0 3%}.lg{height:64%;width:auto}.atm{flex:0 1 62%;aspect-ratio:3.273;background:#fff;-webkit-mask:var(--a-script) center/contain no-repeat;mask:var(--a-script) center/contain no-repeat}
.mix{flex:502 1 0}.slp{flex:503 1 0;padding:6px;gap:8px}.go{flex:155 1 0;padding:6px}.skn{flex:154 1 0}
.slp .lcd{flex:0 0 44%}.slp>.g{flex:1;align-self:stretch;justify-content:center;background:linear-gradient(#e6e9ed,#b6bcc5);border-radius:8px;padding:6px 12px}.slp>.g label{color:#e0001a}.slp>.g label span{color:#a30010}.slp select{color:#e0001a;font-weight:600}
#go{width:100%;height:100%;padding:0;font-size:0;border-radius:9px}#go::before,#rd::before,#pr .bt::before{display:none}
#go::after{content:"";width:34%;max-height:50%;aspect-ratio:33/26;background:#fff;-webkit-mask:var(--a-play) center/contain no-repeat;mask:var(--a-play) center/contain no-repeat}
#go.on::after{-webkit-mask:none;mask:none;width:24px;height:24px;border-radius:3px}
#th{width:92%;height:54%;font-size:clamp(12px,1.3vw,18px)}
#rec{flex:none;width:auto;height:100%;aspect-ratio:1;padding:0;border:0;border-radius:50%;background:var(--a-rec) center/cover;box-shadow:0 3px 6px #0008}#rec svg{display:none}
#pr{flex:1176 1 0;padding:6px;gap:8px}
#pr .bt{flex:1;height:100%;padding:0 0 0 5%;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;text-align:left;overflow:hidden;background:var(--pn);border:0;border-radius:10px;box-shadow:inset 0 0 0 1px #0008}
#pr .bt small{font:500 clamp(10px,1.1vw,21px) 'Jost',sans-serif;letter-spacing:.14em;color:var(--red)}#pr .bt b{font:600 clamp(15px,2.2vw,42px) 'Jost',sans-serif;letter-spacing:.06em;color:var(--red)}
#pr .bt::after{content:"";position:absolute;right:0;bottom:0;height:100%;width:50%;background:var(--red);-webkit-mask:var(--art) right bottom/contain no-repeat;mask:var(--art) right bottom/contain no-repeat}
#pr .bt:nth-child(1){--art:var(--a-forest)}#pr .bt:nth-child(2){--art:var(--a-ruins)}#pr .bt:nth-child(3){--art:var(--a-hills)}
#pr .bt.on{background:linear-gradient(var(--red),var(--red2))}#pr .bt.on small,#pr .bt.on b{color:#fff}#pr .bt.on::after{background:#000;opacity:.35}
.rb{flex:224 1 0;padding:6px;gap:8px}#rd{flex:3;height:100%;padding:0;font-size:0;border-radius:9px;background:linear-gradient(var(--red),var(--red2))}
#rd .ic{width:46%;aspect-ratio:79/57;background:#fff;-webkit-mask:var(--a-shuf) center/contain no-repeat;mask:var(--a-shuf) center/contain no-repeat}#fz{flex:1;height:100%;padding:0 8px 0 22px;font-size:10px}#fz::before{left:7px}
.hr .ky{flex:271 1 0}
#viz{flex:none;height:auto;padding:2vh 1.4vw 0;gap:1.4vw}.win{height:104px;flex:none}body.simple #viz{flex:none;height:auto}
#low{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--lo);margin-top:2vh}
#tabs{padding:2vh 1.4vw 0}#tabs .bt.on{background:#fff;color:var(--lo);border-color:#fff}.pane{padding:0 1.4vw}
#bot{padding:12px 1.4vw 16px}.rf{display:flex;align-items:center;gap:12px}.rf label{font:500 12px 'Jost',sans-serif;letter-spacing:.2em;color:#fff}.rf select{width:auto;min-width:96px}
#bot .lb{color:#ffffffb0}#bot .lb.on{color:#fff}

/* v5 */
:root{--mt:linear-gradient(135deg,#f7f8fa 0%,#a2a8b0 22%,#eef0f3 42%,#7d848d 62%,#d9dde2 82%,#f4f5f7 100%)}
.bt,select{border:2px solid transparent;background:linear-gradient(var(--b1),var(--b2)) padding-box,var(--mt) border-box}
.bt.on{background:linear-gradient(var(--red),var(--red2)) padding-box,var(--mt) border-box;border-color:transparent}
#tabs .bt.on{background:linear-gradient(#fff,#e4e7ea) padding-box,var(--mt) border-box;border-color:transparent;color:var(--lo)}
#pr .bt{border:2px solid transparent;background:linear-gradient(var(--pn),var(--pn)) padding-box,var(--mt) border-box;box-shadow:none}
#pr .bt.on{background:linear-gradient(var(--red),var(--red2)) padding-box,var(--mt) border-box}
#pr .bt{padding-left:12px}#pr .bt b{font-size:clamp(14px,1.8vw,34px)}
.sw{border:2px solid transparent;background:linear-gradient(#000,#000) padding-box,var(--mt) border-box}
.win{background:none;box-shadow:none;border-radius:8px}.win canvas{inset:0;width:100%!important;height:100%!important}#sc,#sp{border:0;box-shadow:none;border-radius:8px}
#go{border:3px solid transparent;border-radius:14px;background:radial-gradient(ellipse at 50% 14%,#ff9a90,#f0291d 34%,#b10c04 78%,#6b0500) padding-box,var(--mt) border-box;box-shadow:inset 0 2px 0 #ffffff55,inset 0 -6px 10px #0006,0 6px 0 #5a0500,0 9px 12px #000a;transition:transform .08s,box-shadow .08s}
#go::before{display:block;content:"";position:absolute;left:10%;right:10%;top:6%;width:auto;height:38%;margin:0;border-radius:12px 12px 50% 50%/12px 12px 40% 40%;background:linear-gradient(#ffffff80,#ffffff00);box-shadow:none}
#go:active,#go.on{transform:translateY(5px);box-shadow:inset 0 3px 8px #000a,0 1px 0 #5a0500,0 2px 4px #000a}
#go.on{background:radial-gradient(ellipse at 50% 14%,#ffc9c2,#ff5a4d 36%,#d01a10 80%,#800800) padding-box,var(--mt) border-box}
.skn #th{width:100%;max-width:156px;height:auto;aspect-ratio:2.3/1;padding:0;border-radius:999px}.skn #th::before{inset:7px;border-radius:999px}
#top{position:relative;z-index:3}#viz{position:relative;z-index:1}#top .hr{height:clamp(84px,9vh,96px)}.mix,.slp,.ttl,.hr .ky{overflow:hidden}
#low{margin-top:1.6vh}#tabs{padding-top:1vh}
.pane{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:0 14px}#p-rack,#p-master{grid-template-columns:1fr}
.pane .m{padding:12px 18px;margin:8px 0}.pane .m .g{flex:1 1 110px;min-width:0}
#p-rack{padding-top:8px}#rh{margin:16px 0 0;padding:22px 0 10px;border-top:0}#mv{padding-top:14px}
#rack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:1000px){#rack{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){#rack{grid-template-columns:1fr}}
#rack .m{min-width:0;overflow:hidden;align-items:flex-end;gap:8px 14px}#rack .m .g{flex:1 1 42%;min-width:0}#rack .m input[type=range]{width:calc(100% - 6px);margin:0 3px}
#rack .m .row .g{flex:1 1 70px}.more{flex:1 1 100%}.more summary{cursor:pointer;font:500 10px 'Jost',sans-serif;letter-spacing:.2em;color:var(--tx);padding:6px 0}.mg{display:flex;flex-wrap:wrap;gap:8px 14px}.mg .g{flex:1 1 42%;min-width:0}

/* v6 */
:root{--bz:var(--mt)}
#viz{padding:1.2vh 1.4vw 0}#top{padding-top:1.4vh;gap:1.2vh}#low{margin-top:1.2vh}
#top .hr:nth-child(2){height:clamp(64px,7.2vh,76px)}
.go{background:linear-gradient(var(--pn),var(--pn)) padding-box,var(--mt) border-box;border:3px solid transparent;border-radius:12px;box-shadow:0 3px 6px #0006;padding:6px}
#go{box-shadow:inset 0 2px 0 #ffffff55,inset 0 -5px 8px #0006,0 3px 0 #5a0500}#go:active,#go.on{transform:translateY(3px);box-shadow:inset 0 3px 8px #000a}
.skn{align-items:center;justify-content:center;gap:6px}.skn #th{width:74%;max-width:112px}
.hr .ky,#pr{background:linear-gradient(var(--pn),var(--pn)) padding-box,var(--mt) border-box}
#pr .bt small{font-size:clamp(9px,.9vw,14px)}#pr .bt b{font-size:clamp(12px,1.45vw,22px)}#pr .bt::after{width:42%}
.rb{flex:170 1 0;flex-direction:column;gap:6px;padding:0;background:none;border:0;box-shadow:none}
#rd,#fz{flex:none;width:100%;height:calc(50% - 3px);padding:0 12px 0 32px;font-size:11px;justify-content:flex-start;background:linear-gradient(var(--b1),var(--b2)) padding-box,var(--mt) border-box}
#rd::before{display:block}#fz::before{left:13px}
#tabs{gap:8px;padding-bottom:0}#p-rack{padding-top:0}#rh{margin:4px 0 0;padding:10px 0 6px}
.sw{width:56px;height:26px}.sw i{top:2px;left:3px;width:18px;height:18px;background:radial-gradient(circle at 35% 30%,#fff,#b9bec5 55%,#6c727a);box-shadow:0 2px 3px #000a,inset 0 0 0 1px #fff8}body.simple .sw i{left:29px}
.sw::after{content:"";position:absolute;right:7px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);opacity:.25}body.simple .sw::after{opacity:1}
#rack{align-items:start}#rack .m{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;align-content:start;align-items:end}
#rack .m h2,#rack .m .row,#rack .m .more{grid-column:1/-1}#rack .m .g{flex:none;min-width:0}
.mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;padding-top:4px}.mg .g{flex:none;min-width:0}.more summary{padding:4px 0 8px}
body.simple #stage{display:block}body.simple .pane{display:none!important}body.simple #p-master{display:grid!important}
body.simple #mv{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px 16px}
body.simple .st.off,body.simple .st button[title=Remove]{display:none}

/* v7: one grid, everything aligned */
#top{display:grid;grid-template-columns:22fr 25fr 25fr 12fr 12fr;grid-template-rows:84px 64px;gap:12px 14px;padding:14px 18px;flex:none}

/* v8 */
#rp .bt::before{display:none}#rp .bt{padding:10px 20px}
#rs{background:linear-gradient(var(--red),var(--red2)) padding-box,var(--mt) border-box;color:#fff}
.sw::after{display:none!important}
.pane{align-items:start}.pane .m{align-items:flex-start;align-content:flex-start}
#rec{position:relative}#rec::after{content:"";position:absolute;inset:10%;border-radius:50%;background:var(--a-spin) center/cover;animation:vin 1.8s linear infinite}@keyframes vin{to{transform:rotate(360deg)}}

/* v9 */
#go:active,#go.on{transform:none!important}
#top{grid-template-columns:22fr 24fr 24fr 12fr 14fr;grid-template-rows:96px 64px}
#top .rb .bt{font-size:9.5px;letter-spacing:.06em}
.slp .sl-l{flex:0 0 46%;display:flex;flex-direction:column;gap:6px;min-width:0}.slp .sl-l .lcd{flex:1 1 auto;width:auto;min-height:0}
.sl-b{display:flex;gap:8px}
.tb{flex:1;height:22px;padding:0;border:2px solid transparent;border-radius:6px;font:600 10px 'Jost',sans-serif;letter-spacing:.14em;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff66,0 2px 3px #0008}
.tp{background:linear-gradient(var(--red),var(--red2)) padding-box,var(--mt) border-box;color:#fff}
.ts{background:linear-gradient(#fff,#dfe2e6) padding-box,var(--mt) border-box;color:#d6001c}
.tb:active{box-shadow:inset 0 2px 4px #0007}

/* v10: skin + REC pills, spiral = play button */
#top .skn{grid-area:1/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0}
#top .go{grid-area:1/5;display:flex;align-items:center;justify-content:center;background:none;border:0;box-shadow:none;padding:0}
#top .rb{grid-area:2/4/3/6}
#top .skn #rec{position:relative;isolation:isolate;width:79px;height:79px;border:0;border-radius:50%;padding:0;cursor:pointer;font:600 12px 'Jost',sans-serif;letter-spacing:.08em;color:#f6dcd9;text-shadow:0 1px 0 #ffffff77,0 -1px 0 #0009;background:conic-gradient(from 210deg,#f7f8f9,#a3a8ae,#e8eaec,#7a8087,#f4f5f6,#a9aeb4,#e4e6e8,#8a9097,#f7f8f9);box-shadow:0 4px 8px #000a,0 0 0 1px #0006,inset 0 0 0 2px #ffffffaa,inset 0 -3px 4px #0005;width:100%;max-width:100px;height:auto;aspect-ratio:2.3/1;min-width:0;padding:0;margin:0;gap:0;border-radius:999px;font:600 10px 'Jost',sans-serif;letter-spacing:.04em;line-height:1;white-space:nowrap;display:block}
#top .skn #rec::before{content:"";position:absolute;inset:9.5px;border-radius:50%;z-index:-1;background:radial-gradient(circle at 34% 26%,#ff9b90 0,#ec2a1e 30%,#b80f07 62%,#6f0803 100%);box-shadow:inset 0 2px 3px #ffffff88,inset 0 -3px 5px #0008,0 1px 2px #000a,0 0 0 2px #2c2d31;inset:7px;border-radius:999px}
#top .skn #rec::after{display:none}#top .skn #rec:hover{filter:hue-rotate(var(--hue)) brightness(1.06)}
#top .go #go{position:relative;width:84px;height:84px;min-width:0;padding:0;border:0;border-radius:50%;background:var(--a-rec) center/cover;box-shadow:0 3px 6px #0008;font-size:0}
#top .go #go.on{background:var(--a-rec) center/cover;border:0;box-shadow:0 3px 6px #0008}
#top .go #go::before{display:none}
#top .go #go::after,#top .go #go.on::after{content:"";position:absolute;inset:10%;width:auto;height:auto;max-height:none;aspect-ratio:auto;border-radius:50%;-webkit-mask:none;mask:none;background:var(--a-spin) center/cover;animation:vin 1.8s linear infinite;animation-play-state:paused}
#top .go #go.on::after{animation-play-state:running}

/* v11: reference-2 layout, big PLAY pill */
#top{grid-template-columns:412fr 450fr 450fr 130fr 328fr}
#top .ttl{background:linear-gradient(#050506,#050506) padding-box,var(--mt) border-box}
#top .go #go,#top .go #go.on{position:relative;isolation:isolate;width:79px;height:79px;border:0;border-radius:50%;padding:0;cursor:pointer;font:600 12px 'Jost',sans-serif;letter-spacing:.08em;color:#f6dcd9;text-shadow:0 1px 0 #ffffff77,0 -1px 0 #0009;background:conic-gradient(from 210deg,#f7f8f9,#a3a8ae,#e8eaec,#7a8087,#f4f5f6,#a9aeb4,#e4e6e8,#8a9097,#f7f8f9);box-shadow:0 4px 8px #000a,0 0 0 1px #0006,inset 0 0 0 2px #ffffffaa,inset 0 -3px 4px #0005;width:100%;max-width:none;height:76px;min-width:0;padding:0;margin:0;border-radius:999px;font:600 26px 'Jost',sans-serif;letter-spacing:.14em;line-height:1;white-space:nowrap;display:block;transform:none!important}
#top .go #go::before,#top .go #go.on::before{content:"";position:absolute;inset:9.5px;border-radius:50%;z-index:-1;background:radial-gradient(circle at 34% 26%,#ff9b90 0,#ec2a1e 30%,#b80f07 62%,#6f0803 100%);box-shadow:inset 0 2px 3px #ffffff88,inset 0 -3px 5px #0008,0 1px 2px #000a,0 0 0 2px #2c2d31;display:block;inset:8px;border-radius:999px}
#top .go #go.on::before{filter:brightness(.82)}
#top .go #go::after,#top .go #go.on::after{display:none;animation:none}
.tb{letter-spacing:.1em}

/* v12 */
#top .go #go,#top .go #go.on{display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px #0009}
#top .go #go::before,#top .go #go.on::before{top:8px;left:8px;right:8px;bottom:8px;width:auto;height:auto;margin:0;box-shadow:inset 0 3px 5px #ffffff55,inset 0 -5px 8px #00000066}

/* v13: equal mixer columns, narrower key/mode, wider presets */
#top{grid-template-columns:320fr 92fr 450fr 450fr 130fr 328fr}
#top .ttl{grid-area:1/1/2/3}#top .mix{grid-area:1/3}#top .slp{grid-area:1/4}#top .skn{grid-area:1/5}#top .go{grid-area:1/6}
#top .ky{grid-area:2/1;padding:0 18px}#top .ky b{font-size:17px;letter-spacing:.1em;white-space:nowrap}
#top #pr{grid-area:2/2/3/5}#top .rb{grid-area:2/5/3/7}
#top .mix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 22px;align-items:center;padding:0 22px}
#top .mix .g{min-width:0;width:100%}#top .mix input[type=range]{width:100%;min-width:0}
.slp>.g label{justify-content:center;text-align:center}.slp select{text-align:center;text-align-last:center}
.ttl .tw{flex:0 1 62%;height:92%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%}
.ttl .tw .atm{flex:none;height:78%;max-width:100%;aspect-ratio:3.273}
.ttl .by{flex:none;color:#fff;font:500 clamp(7px,1.15vh,10px)/1 'Jost','Saira',sans-serif;letter-spacing:.32em;text-indent:.32em;text-transform:uppercase;white-space:nowrap;opacity:.92}

const MODES={Dorian:[0,2,3,5,7,9,10],Aeolian:[0,2,3,5,7,8,10],Phrygian:[0,1,3,5,7,8,10]},NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const IDS=['a1','a2','a3','c1','c2','c3','s1','s2','s3','e1','e2','e3','b1','b2','b3','b4'];

'ANCIENT RUINS':{r:4,m:'Phrygian',v:[.14,.3,.3,.6,.25,.12,.45,.3,.25,.08,.7,.3,.5,.45,.6,.10]},
'MISTY MOUNTAINS':{r:9,m:'Aeolian',v:[.10,.6,.55,.45,.7,.09,.55,.55,.5,.14,.5,.75,.2,.2,.3,.07]}};

{n:'CHOIR',t:'choir',d:'Ethereal sustained voices',c:'#6f9bff',s:[['c3','VOLUME'],['c1','DENSITY'],['c2','PITCH']]},
{n:'STRINGS',t:'strings',d:'Slow cinematic pads',c:'#7fd6a0',s:[['s1','VOLUME'],['s2','BRIGHT'],['s3','CHANGE']]},
{n:'ENVIRONMENT',t:'surround',d:'Wind · rain · distant rumble',c:'#5ec9c0',s:[['e1','VOLUME'],['e2','GRAIN'],['e3','MOTION']]},

const LM={},V={},S={root:2,mode:'Dorian',deg:0,fz:0,evo:.5,vol:.6},ACT=[0,0,0,0,0],TM={},IN={},VL={};

const F=()=>.3+1.4*S.evo,sc=()=>MODES[S.mode],ivl=k=>sc()[k%7]+12*Math.floor(k/7),mtof=m=>440*Math.pow(2,(m-69)/12);

/* ---------- procedural buffers ---------- */
function impulse(c,sec){const sr=c.sampleRate,n=sr*sec|0,b=c.createBuffer(2,n,sr),pd=sr*.04|0;
for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let y=0;for(let i=pd;i<n;i++){const t=(i-pd)/n,k=.6-.55*Math.sqrt(t);y+=((Math.random()*2-1)*Math.exp(-7.2*t)-y)*k;d[i]=y*(t<.01?t*100:1)}}return b}
function noise(c){const sr=c.sampleRate,n=sr*8|0,b=c.createBuffer(2,n,sr),f=sr*.5|0;
for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let b0=0,b1=0,b2=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.25}

const lay=(dry,rv,dl)=>{const o=G(),a=G(),b=G(),e=G();o.gain.value=0;a.gain.value=dry;b.gain.value=rv;e.gain.value=dl;o.connect(a).connect(A.mix);o.connect(b).connect(A.rvIn);o.connect(e).connect(A.dlIn);return o};

const vox=(ty,b,dest,dets)=>{const g=G();g.gain.value=b;g.connect(dest);const o=dets.map(d=>{const x=c.createOscillator(),y=G();x.type=ty;x.detune.value=d;y.gain.value=1/dets.length;x.connect(y).connect(g);x.start();return x});return{g,o,b,on:0,off:-99}};
